name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q -m "not live"
      - name: Reject committed secrets
        shell: bash
        run: |
          if git grep -nE '(sk-[A-Za-z0-9_-]{20,}|bot[0-9]{6,}:[A-Za-z0-9_-]{20,})' -- ':!tests'; then
            echo "Potential secret found"
            exit 1
          fi
