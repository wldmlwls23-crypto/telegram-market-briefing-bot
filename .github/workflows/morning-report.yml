name: Morning Market Report

on:
  workflow_dispatch:

concurrency:
  group: jin-market-pulse-morning
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wake Railway and send the report
        env:
          RAILWAY_JOB_URL: ${{ secrets.RAILWAY_JOB_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$RAILWAY_JOB_URL"
          test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error \
            --max-time 600 \
            --request POST \
            --header "Authorization: Bearer $CRON_SECRET" \
            --header "X-Idempotency-Key: github-$(date -u +%F)" \
            "$RAILWAY_JOB_URL/jobs/morning"
